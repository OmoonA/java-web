<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>League of Legends - 챔피언</title>
    <link rel="icon" type="image/png" href="../images/role/logo.png">
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/main.css">
    <script src="../js/bootstrap.bundle.min.js"></script>
    <script src="../js/test2.js"></script>
    <script src="../js/test.js"></script>
    <script src="../js/toggleTheme.js"></script>
    <script>
        window.addEventListener('load', function () {
            fetch('/profile/info', { credentials: 'same-origin' })
                .then(function (res) {
                    if (!res.ok) return null;
                    return res.json();
                })
                .then(function (data) {
                    const authNavItems = document.getElementById('authNavItems');
                    if (!authNavItems || !data) return;

                    authNavItems.outerHTML = `
                        <li class="nav-item">
                            <a class="nav-link" href="/profile" id="profileNavLink"
                                data-bs-toggle="tooltip" data-bs-placement="bottom"> 프로필</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link btn btn-outline-danger btn-sm px-3" href="/logout">로그아웃</a>
                        </li>
                    `;

                    const profileLink = document.getElementById('profileNavLink');
                    if (profileLink && window.bootstrap) {
                        new bootstrap.Tooltip(profileLink, {
                            title: ' ' + data.username,
                            placement: 'bottom'
                        });
                    }
                });
        });
    </script>
</head>

<body>

    <!-- 헤더 (Navbar) -->
    <nav class="navbar navbar-expand-lg bg-body-tertiary" data-bs-theme="dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="http://localhost:8080/">
                <img src="../images/logo.webp" alt="" width="30" height="24">
            </a>
            <button class="btn border-0" id="themeToggleBtn">
                DARK
            </button>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" href="news.html">뉴스</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="champions.html">챔피언</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="download.html">다운로드</a>
                    </li>
                    <li class="nav-item" id="authNavItems">
                        <a class="nav-link" href="/login">로그인</a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown"
                            aria-expanded="false">
                            외부웹사이트
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="https://op.gg/ko">롤전적</a></li>
                            <li><a class="dropdown-item" href="https://www.youtube.com/channel/UCooLkG0FfrkPBQsSuC95L6w" target="_blank" rel="noopener noreferrer">롤 공식 유튜브</a></li>
                            <li><a class="dropdown-item" href="https://instagram.com/leagueoflegendskorea" target="_blank" rel="noopener noreferrer">롤 공식 인스타</a></li>
                        </ul>
                    </li>
                </ul>
                <!-- 6주차 검색 폼 -->
                <form class="d-flex" role="search" id="searchForm">
                    <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search"
                        id="searchInput" />
                    <button class="btn btn-outline-success" type="submit">Search</button>
                </form>
            </div>
        </div>
    </nav>

    <!-- 챔피언 페이지 -->
    <section class="champion-page-hero text-center">
        <div class="container">
            <h1 class="display-4 fw-bold">챔피언</h1>
            <p class="lead">역할군을 선택해서 원하는 챔피언만 확인하세요.</p>
        </div>
    </section>

    <!-- 역할군 선택 -->
    <section class="container my-5">
        <div class="role-filter-wrap">
            <button class="role-filter-btn active" type="button" data-role="all" title="전체">
                <img src="../images/role/logo.png" alt="전체">
                <span>전체</span>
            </button>
            <button class="role-filter-btn" type="button" data-role="ad" title="원거리 딜러">
                <img src="../images/role/AD.avif" alt="원거리 딜러">
                <span>원딜</span>
            </button>
            <button class="role-filter-btn" type="button" data-role="assassin" title="암살자">
                <img src="../images/role/assassin.avif" alt="암살자">
                <span>암살자</span>
            </button>
            <button class="role-filter-btn" type="button" data-role="supporter" title="서포터">
                <img src="../images/role/supporter.avif" alt="서포터">
                <span>서포터</span>
            </button>
            <button class="role-filter-btn" type="button" data-role="tanker" title="탱커">
                <img src="../images/role/tanker.avif" alt="탱커">
                <span>탱커</span>
            </button>
            <button class="role-filter-btn" type="button" data-role="warrior" title="전사">
                <img src="../images/role/warrior.avif" alt="전사">
                <span>전사</span>
            </button>
            <button class="role-filter-btn" type="button" data-role="wizard" title="마법사">
                <img src="../images/role/wizard.avif" alt="마법사">
                <span>마법사</span>
            </button>
        </div>

        <h2 class="text-center my-5 accent-purple" id="championRoleTitle">전체 챔피언</h2>
        <div class="row g-4" id="championPageList"></div>
    </section>

    <script src="../js/search.js"></script>
    <script src="../js/champions-page.js"></script>
</body>

</html>
